[package]
name = "wpp-ffi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "wpp_ffi"

[features]
cli = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[dependencies]
wpp = { path = "../wpp" }
wpp-store = { path = "../wpp-store" }
uniffi = { version = "0.32.2", default-features = false }
thiserror = "1"

