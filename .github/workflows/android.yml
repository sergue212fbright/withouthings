name: Android privacy test build

on:
  push:
    branches: [privacy-hardening]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Rust and Android tools
        shell: bash
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Rust tests
        run: cargo test --workspace --locked
      - name: Check privacy policy
        run: python3 tools/check_privacy.py
      - name: Android unit tests, lint, and APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Check merged manifest
        shell: bash
        run: |
          manifest=$(find app/build/intermediates/merged_manifests/debug -name AndroidManifest.xml -print -quit)
          test -n "$manifest"
          python3 tools/check_privacy.py "$manifest"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: withouthings-privacy-test-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/lint-results-debug.html
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: error
          retention-days: 30
