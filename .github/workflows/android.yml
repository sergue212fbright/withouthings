name: Android privacy test build

on:
  push:
    branches: [privacy-hardening]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_TERM_COLOR: always
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Rust and Android tools
        shell: bash
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked
          python3 tools/setup_android_sdk.py
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Rust tests
        run: cargo test --workspace --locked
      - name: Check privacy policy
        run: python3 tools/check_privacy.py
      - name: Android unit tests, lint, and APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Check merged manifest
        shell: bash
        run: |
          manifest=$(find app/build/intermediates/merged_manifests/debug -name AndroidManifest.xml -print -quit)
          test -n "$manifest"
          python3 tools/check_privacy.py "$manifest"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: withouthings-privacy-test-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/lint-results-debug.html
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: error
          retention-days: 30
